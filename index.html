<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Login Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="box">
        <form>
            <h1>Website</h1>
            <div>
                <label for="inpuser">Username:</label>
            </div>
            <div>
                <input type="text" id="inpuser" placeholder="Enter your Username💖">
            </div>
            <div>
                <label for="inppass">Password:</label>
            </div>
            <div>
                <input type="text" id="inppass" placeholder="Enter your Password🌐">
            </div>
            <div id="button">
               <button>Login</button>
            </div>   
        </form>
    </div>
</body>
</html>
